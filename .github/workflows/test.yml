name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The release binary of VictoriaMetrics used by tests/test_vm_integration.py,
  # the same version as in the ifdd-ts template; started with deduplication
  # like there.
  VM_VERSION: v1.155.0
  VM_SHA256: 7180e65913d55ab99c0be8f4a3ad17a0fafe5598a21ff6327fecba3190d7b176

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Start VictoriaMetrics
        run: |
          curl -sSfL -o vm.tgz \
            "https://github.com/VictoriaMetrics/VictoriaMetrics/releases/download/${VM_VERSION}/victoria-metrics-linux-amd64-${VM_VERSION}.tar.gz"
          echo "${VM_SHA256}  vm.tgz" | sha256sum -c -
          tar -xzf vm.tgz
          ./victoria-metrics-prod -storageDataPath="$RUNNER_TEMP/vm" \
            -httpListenAddr=127.0.0.1:8428 -dedup.minScrapeInterval=1ms \
            -retentionPeriod=10y > "$RUNNER_TEMP/vm.log" 2>&1 &
          for _ in $(seq 1 50); do
            curl -sf http://127.0.0.1:8428/health && exit 0
            sleep 0.2
          done
          cat "$RUNNER_TEMP/vm.log"
          exit 1

      - name: Test
        env:
          IFDD_TEST_VM_URL: http://127.0.0.1:8428
        run: pytest -q

  docs:
    name: Documentation (docs/en, docs/de)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install
        run: pip install . -r tests/docs/requirements.txt

      - name: Export the OpenAPI document for both languages
        run: |
          for language in en de; do
            python -c "import json; from ifdd.ts.core.app import openapi_document; json.dump(openapi_document(), open('docs/$language/openapi.json', 'w'))"
          done

      - name: Both languages match and build without warnings
        run: python tests/check_docs.py . --prefix ifdd-ts-core-

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Build
        run: |
          pip install build
          python -m build

      - name: Check that the namespace stays implicit
        run: python .github/scripts/check_namespace.py

      - name: Check that the wheel carries the documentation assets
        run: python .github/scripts/check_wheel_assets.py

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
